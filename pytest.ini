[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Ensures the project root (where escrow_main.py, escrow_models.py, etc.
# live) is importable regardless of whether pytest is invoked as `pytest`
# or `python -m pytest` — the plain `pytest` command doesn't always add the
# current directory to sys.path on its own, which otherwise causes
# "ModuleNotFoundError: No module named 'escrow_models'" from conftest.py.
pythonpath = .
